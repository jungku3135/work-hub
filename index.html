<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%A0</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>🏠 시스템팀 Work Hub</h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="dashboard">대시보드</button>
    <button class="tab-btn" data-tab="tasks">태스크</button>
    <button class="tab-btn" data-tab="projects">프로젝트</button>
    <button class="tab-btn" data-tab="meetings">회의록</button>
    <button class="tab-btn" data-tab="report">업무일지</button>
    <div class="nav-dropdown" id="util-dropdown">
      <button class="tab-btn" id="util-dropdown-btn" type="button">유틸리티 ▾</button>
      <div class="nav-dropdown-menu hidden" id="util-dropdown-menu"></div>
    </div>
  </nav>
  <div class="sync-box">
    <button id="mode-indicator" class="mode-indicator" type="button" title="모드 확인 중...">👀 뷰어 모드</button>
    <span id="last-sync-label" class="muted">-</span>
    <button id="sync-now-btn" class="btn btn-ghost">지금 동기화</button>
    <button id="theme-toggle-btn" class="btn btn-ghost" title="다크모드 전환">🌙</button>
  </div>
</header>

<main id="app"></main>

<div id="util-preview-panel" class="util-preview-panel hidden">
  <div class="util-preview-header">
    <span class="util-preview-title" id="util-preview-title"></span>
    <div class="util-preview-actions">
      <a id="util-preview-open-new" class="btn btn-sm btn-ghost" href="#" target="_blank" rel="noopener noreferrer" title="새 창에서 열기">⧉ 새 창</a>
      <button id="util-preview-minimize" class="btn btn-sm btn-ghost" title="최소화">─</button>
      <button id="util-preview-close" class="btn btn-sm btn-ghost" title="닫기">✕</button>
    </div>
  </div>
  <div class="util-preview-body">
    <iframe id="util-preview-iframe" title="유틸리티 미리보기"></iframe>
  </div>
</div>
<div id="util-preview-restore" class="util-preview-restore hidden">
  <span id="util-preview-restore-body" class="util-preview-restore-body" title="미리보기 다시 열기">
    <span class="util-preview-restore-icon">🔗</span>
    <span id="util-preview-restore-label" class="util-preview-restore-label"></span>
  </span>
  <button id="util-preview-restore-close" class="util-preview-restore-close" title="닫기">✕</button>
</div>

<button id="notif-fab" class="chat-fab notif-fab" title="업무 리마인더 알림">🔔</button>

<div id="modal-root" class="modal-root hidden"></div>
<div id="auth-modal-root" class="modal-root hidden"></div>
<div id="img-lightbox" class="img-lightbox hidden">
  <img id="img-lightbox-img" alt="확대 이미지" />
</div>
<div id="toast" class="toast hidden"></div>
<div id="print-report-root"></div>

<script src="notion-client.js"></script>
<script src="config.js"></script>
<script src="notion-adapter.js"></script>
<script src="app.js"></script>
</body>
</html>
