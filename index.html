<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>개인 Work Hub</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>🏠 개인 Work Hub</h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="tasks">태스크</button>
    <button class="tab-btn" data-tab="projects">프로젝트</button>
    <button class="tab-btn" data-tab="meetings">회의록</button>
    <button class="tab-btn" data-tab="report">업무일지</button>
    <button class="tab-btn" data-tab="settings">⚙ 설정</button>
  </nav>
  <div id="weather-box" class="weather-box"></div>
</header>

<main id="app"><div class="muted" style="padding:2rem;">불러오는 중...</div></main>

<div id="modal-root" class="modal-root hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="notion-client.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
